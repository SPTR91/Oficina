            async function cargarMetrics() {
                // Si el supervisor tiene desplegada alguna caja de edición/inspección de usuario, no sobreescribir mientras interactúa
                const cajaAbierta = Array.from(listaEquipo.querySelectorAll('.supervisor-tasks-box, .box-cfg-user')).some(el => el.style.display === 'block' || el.style.display === 'flex');
                if (cajaAbierta) return;

                let { data: users } = await db.from('usuarios').select('*').order('created_at', { ascending: true });
                let { data: tasks } = await db.from('tareas').select('id, asignado_a, completada, prioridad, fecha_programada, fecha_completada, texto, actualizaciones');
                if (!users || !tasks) return;

                cacheUsuarios = users;
                actualizarSelectFiltroEquipos();

                const filtroEq = selectFiltroEquipo.value;
                const usuariosFiltrados = filtroEq === 'TODOS' ? users : users.filter(u => (u.equipo || 'General') === filtroEq);

                listaEquipo.innerHTML = '';
                const ahora = new Date(); 
                const hoyInicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
                const hoyPrefijo = `${ahora.getDate().toString().padStart(2,'0')}/${(ahora.getMonth()+1).toString().padStart(2,'0')}`;
                
                usuariosFiltrados.forEach(u => {
                    const misTareas = tasks.filter(t => (t.asignado_a || '').toLowerCase() === u.nombre.toLowerCase());
                    const pendientes = misTareas.filter(t => !t.completada);
                    const compHoy = misTareas.filter(t => t.completada && t.fecha_completada && new Date(t.fecha_completada) >= hoyInicio).length;
                    
                    let hitosHoy = 0;
                    misTareas.forEach(t => { 
                        if(Array.isArray(t.actualizaciones)) { 
                            hitosHoy += t.actualizaciones.filter(a => { 
                                if (a.ts) return new Date(a.ts) >= hoyInicio;
                                if (a.fecha && a.fecha.startsWith(hoyPrefijo)) return true;
                                return false;
                            }).length; 
                        }
                    });
                    
                    const p1 = pendientes.filter(t => t.prioridad === 1).length;
                    const vencidas = pendientes.filter(t => t.fecha_programada && new Date(t.fecha_programada) < ahora).length;
                    const aFuturo = pendientes.filter(t => t.fecha_programada && new Date(t.fecha_programada) >= ahora).length;
                    
                    const ua = u.ultima_actividad ? formatFechaAbsoluta(u.ultima_actividad) : 'Sin registro';
                    const tareaEnfObj = (u.tarea_enfocada !== null && u.tarea_enfocada !== undefined) ? tasks.find(x => String(x.id) === String(u.tarea_enfocada) && !x.completada) : null;
                    const enf = tareaEnfObj ? tareaEnfObj.texto : 'Ninguno';

                    const onlineTime = u.online_at ? new Date(u.online_at) : null;
                    const isOnline = onlineTime && (ahora - onlineTime < 90000);
                    const uRol = u.rol || (u.es_admin ? 'Admin' : 'ATC');
                    const uEq = u.equipo || 'General';

                    const div = document.createElement('div'); div.className = 'equipo-card task-item';
                    div.innerHTML = `
                        <div class="equipo-header">
                            <span class="equipo-name">
                                <span class="online-dot ${isOnline ? 'on' : 'off'}"></span>
                                ${u.nombre} ${u.apellido || ''}
                                <span class="role-tag">${uRol}</span>
                                <span class="role-tag" style="background:#e8f4f8; color:#2980b9;">${uEq}</span>
                            </span>
                            <div style="display:flex; gap:4px; flex-wrap:wrap;">
                                <button class="btn-txt-sm insp-btn" style="color:var(--accent); border-color:var(--accent);">Tareas (${pendientes.length})</button>
                                ${esAdminGlobal ? `<button class="btn-txt-sm cfg-btn">Rol/Eq</button>` : ''}
                                ${esAdminGlobal ? `<button class="btn-txt-sm reset-pin">PIN</button>` : ''}
                                ${esAdminGlobal && u.nombre !== 'manuel' ? `<button class="btn-txt-sm del-user" style="color:var(--danger); border-color:var(--danger);">✕</button>` : ''}
                            </div>
                        </div>
                        <div style="font-size: 11px; color: var(--secondary); line-height: 1.5;">
                            <div>⏱️ Act: <span style="font-weight: bold; color: var(--primary);">${ua}</span> | 📈 Hoy: <span style="font-weight: bold; color: var(--primary);">${compHoy + hitosHoy}</span> (${compHoy} cerradas, ${hitosHoy} hitos)</div>
                            <div style="color:${tareaEnfObj ? 'var(--prio-2)' : 'var(--secondary)'}; font-weight:600;">🎯 Enfoque: <span style="font-weight:${tareaEnfObj ? '600' : 'normal'}; color:${tareaEnfObj ? 'var(--primary)' : 'var(--secondary)'};">${enf}</span></div>
                            <div>📋 Carga: <b>${pendientes.length}</b> (🔴 ${p1} urgentes | ⏭️ ${aFuturo} futuro) ${vencidas > 0 ? `<span style="color:var(--danger); font-weight:bold;">• ⚠️ ${vencidas} vencidas</span>` : ''}</div>
                        </div>
                        
                        <div class="action-box box-cfg-user inline" style="display:none; margin-top:6px;">
                            <select class="action-input edit-u-rol">
                                <option value="ATC" ${uRol==='ATC'?'selected':''}>ATC</option>
                                <option value="Ejecutivo" ${uRol==='Ejecutivo'?'selected':''}>Ejecutivo</option>
                                <option value="Supervisor" ${uRol==='Supervisor'?'selected':''}>Supervisor</option>
                                <option value="Admin" ${uRol==='Admin'?'selected':''}>Admin</option>
                            </select>
                            <input type="text" class="action-input edit-u-eq" value="${uEq}" placeholder="Equipo">
                            <button class="btn-txt-sm btn-save-cfg" style="background:var(--primary); color:white;">OK</button>
                        </div>

                        <div class="supervisor-tasks-box" style="display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);"></div>
                    `;
                    listaEquipo.appendChild(div);

                    if (esAdminGlobal) {
                        const cfgBtn = div.querySelector('.cfg-btn');
                        const boxCfg = div.querySelector('.box-cfg-user');
                        cfgBtn.onclick = () => { boxCfg.style.display = boxCfg.style.display === 'flex' ? 'none' : 'flex'; };
                        div.querySelector('.btn-save-cfg').onclick = async () => {
                            const nr = div.querySelector('.edit-u-rol').value;
                            const ne = div.querySelector('.edit-u-eq').value.trim() || 'General';
                            await db.from('usuarios').update({ rol: nr, equipo: ne, es_admin: nr === 'Admin' }).eq('nombre', u.nombre);
                            if (u.nombre === nombreActual) {
                                equipoActual = ne;
                                panelTareas.querySelector('#badge-equipo').innerText = equipoActual;
                                btnChatEq.innerHTML = `${equipoActual.toUpperCase()} <div class="dot-indicator" id="dot-sub-eq"></div>`;
                            }
                            boxCfg.style.display = 'none';
                            await refrescarCacheUsuarios();
                            cargarMetrics();
                        };

                        const btnReset = div.querySelector('.reset-pin');
                        btnReset.onclick = () => pedirConfirmacion(btnReset, '¿Reset?', async () => {
                            await db.from('usuarios').update({ pin: null }).eq('nombre', u.nombre);
                        });

                        const btnDelUser = div.querySelector('.del-user');
                        if(btnDelUser) {
                            btnDelUser.onclick = () => pedirConfirmacion(btnDelUser, '¿Borrar?', async () => {
                                await db.from('tareas').delete().ilike('asignado_a', u.nombre);
                                await db.from('notas').delete().eq('usuario', u.nombre);
                                await db.from('usuarios').delete().eq('nombre', u.nombre);
                                await refrescarCacheUsuarios();
                                cargarMetrics();
                            });
                        }
                    }

                    const inspBtn = div.querySelector('.insp-btn');
                    const supBox = div.querySelector('.supervisor-tasks-box');
                    inspBtn.onclick = () => {
                        const vis = supBox.style.display === 'block';
                        supBox.style.display = vis ? 'none' : 'block';
                        if(!vis) {
                            supBox.innerHTML = '';
                            if(!pendientes.length) {
                                supBox.innerHTML = `<div style="font-size:11px; color:var(--secondary);">Sin pendientes.</div>`;
                            } else {
                                pendientes.forEach(pt => {
                                    const tRow = document.createElement('div');
                                    tRow.style.cssText = "display:flex; flex-direction:column; gap:4px; background:#f8fafc; padding:6px; border:1px solid var(--border); margin-bottom:4px; border-radius:4px;";
                                    tRow.innerHTML = `
                                        <div style="font-size:12px; color:var(--primary); word-break:break-word;">${linkify(pt.texto)}</div>
                                        <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
                                            <select class="sup-select-trans" style="flex:1; min-width:120px; height:26px; font-size:11px; padding:2px;">${generarOpcionesUsuariosHtml(u.nombre)}</select>
                                            <button class="btn-txt-sm sup-reassign-btn" style="font-size:10px;">Mover</button>
                                            <button class="btn-txt-sm sup-del-task-btn" style="font-size:10px; color:var(--danger); border-color:var(--danger);">✕</button>
                                        </div>
                                    `;
                                    supBox.appendChild(tRow);

                                    const btnMover = tRow.querySelector('.sup-reassign-btn');
                                    const selMover = tRow.querySelector('.sup-select-trans');
                                    btnMover.onclick = () => {
                                        const nuevoDest = selMover.value;
                                        if(!nuevoDest) return alert("Elige destino.");
                                        pedirConfirmacion(btnMover, '¿Confirmar?', async () => {
                                            supBox.style.display = 'none';
                                            await db.from('tareas').update({ 
                                                asignado_a: nuevoDest, 
                                                transferido_por: nombreActual, 
                                                fecha_transferencia: new Date().toISOString(), 
                                                estado_transferencia: 'pendiente' 
                                            }).eq('id', pt.id);
                                            cargarMetrics(); renderTareas(); renderDelegadas();
                                        });
                                    };

                                    const btnDelT = tRow.querySelector('.sup-del-task-btn');
                                    btnDelT.onclick = () => pedirConfirmacion(btnDelT, '¿Borrar?', async () => {
                                        supBox.style.display = 'none';
                                        await db.from('tareas').delete().eq('id', pt.id);
                                        cargarMetrics(); renderTareas();
                                    });
                                });
                            }
                        }
                    };
                });
                aplicarFiltroGlobal();
            }

            // Suscripciones en Tiempo Real + Canal Broadcast para Enfoque Inmediato
            syncChannel = db.channel('oficina_sync_live')
                .on('broadcast', { event: 'estado_actualizado' }, () => {
                    if (esSupervisorGlobal) cargarMetrics();
                })
                .subscribe();

            db.channel('public:tareas').on('postgres_changes', { event: '*', schema: 'public', table: 'tareas' }, () => { 
                renderTareas(true); renderHistorial(); renderDelegadas(true); if(esSupervisorGlobal) cargarMetrics(); 
            }).subscribe();

            db.channel('public:usuarios').on('postgres_changes', { event: '*', schema: 'public', table: 'usuarios' }, () => { 
                refrescarCacheUsuarios(); if(esSupervisorGlobal) cargarMetrics(); 
            }).subscribe();

            db.channel('public:notas').on('postgres_changes', { event: '*', schema: 'public', table: 'notas' }, () => { 
                renderNotas(); 
            }).subscribe();

            db.channel('public:mensajes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, (payload) => { 
                const m = payload.new;
                const esMio = (m.usuario || '').toLowerCase() === nombreActual;
                const esGeneral = !m.canal || m.canal === 'general';
                const esDeMiEquipo = m.canal === 'equipo' && (m.equipo_destino || '').toLowerCase() === equipoActual.toLowerCase();

                if (esGeneral || esDeMiEquipo) {
                    if (!esMio) {
                        emitirAlerta();
                        if (!tabChat.classList.contains('active')) {
                            panelUtilidades.querySelector('#dot-chat').style.display = 'block';
                            panelTareas.querySelector('#dot-chat-pip').style.display = 'block';
                        }
                        if (esGeneral && chatCanalActivo !== 'general') {
                            dotSubGral.style.display = 'block';
                        } else if (esDeMiEquipo && chatCanalActivo !== 'equipo') {
                            const dEq = btnChatEq.querySelector('#dot-sub-eq');
                            if (dEq) dEq.style.display = 'block';
                        }
                    }
                    renderChat();
                }
            }).subscribe();

            // Respaldo de sincronización continua para el Panel de Equipo cada 8 segundos
            if (esSupervisorGlobal) {
                if (supervisorPollInterval) clearInterval(supervisorPollInterval);
                supervisorPollInterval = setInterval(() => {
                    if (tabEquipo.classList.contains('active')) cargarMetrics();
                }, 8000);
            }

            renderTareas(); renderNotas(); renderChat(); renderHistorial(); renderDelegadas();
            if(esSupervisorGlobal) cargarMetrics();
        }
    </script>
</body>
</html>
